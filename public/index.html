<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בודק הערות לציונים</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;min-height:100vh;padding:20px;color:#1a202c}
.box{max-width:900px;margin:0 auto}
h1{text-align:center;color:#2b6cb0;margin-bottom:4px;font-size:1.8rem}
.sub{text-align:center;color:#718096;font-size:.9rem;margin-bottom:20px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.drop{border:2.5px dashed #90cdf4;border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;background:#f7fafc}
.drop h3{color:#2d3748;margin:10px 0 4px}
.drop p{color:#a0aec0;font-size:.85rem}
.icon{font-size:2.8rem}
#fi{display:none}
.msg{display:none;border-radius:8px;padding:10px 14px;font-size:.9rem;margin-top:10px}
.msg.ok{background:#ebf8ff;border:1px solid #bee3f8;color:#2b6cb0}
.msg.bad{background:#fff5f5;border:1px solid #fed7d7;color:#c53030}
.btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;font-size:1rem;font-weight:700;background:#3182ce;color:white;margin-top:4px;font-family:inherit}
.btn:disabled{background:#e2e8f0;color:#a0aec0;cursor:not-allowed}
.prog{display:none;margin-top:14px}
.pgb{background:#e2e8f0;border-radius:8px;height:10px;overflow:hidden}
.pgi{height:100%;background:#3182ce;border-radius:8px;transition:width .4s;width:0%}
.pgl{text-align:center;color:#4a5568;font-size:.85rem;margin-top:6px}
.err{display:none;background:#fff5f5;border:1px solid #fed7d7;border-radius:10px;padding:12px;color:#c53030;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.st{background:white;border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sn{font-size:2.2rem;font-weight:800}
.sl{color:#718096;font-size:.82rem;margin-top:3px}
.sb .sn{color:#3182ce}.sg .sn{color:#38a169}.sr .sn{color:#e53e3e}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:5px 12px;border-radius:20px;border:1.5px solid #e2e8f0;cursor:pointer;font-size:.82rem;font-weight:600;background:white;font-family:inherit}
.tab.on{background:#2b6cb0;color:white;border-color:#2b6cb0}
.rc{background:white;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);border-right:5px solid}
.rc.cok{border-right-color:#38a169}.rc.cwn{border-right-color:#ed8936}.rc.cer{border-right-color:#e53e3e}
.rc.hid{display:none}
.rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.rn{font-size:1.05rem;font-weight:700}.rm{font-size:.8rem;color:#718096;margin-top:2px}
.gp{padding:4px 14px;border-radius:20px;font-weight:800;font-size:1rem}
.ga{background:#c6f6d5;color:#22543d}.gb{background:#bee3f8;color:#1a365d}.gc{background:#fefcbf;color:#744210}.gd{background:#fbd38d;color:#7b341e}.gf{background:#fed7d7;color:#742a2a}
.lb{font-size:.72rem;font-weight:700;color:#a0aec0;text-transform:uppercase;margin-bottom:3px}
.cm{background:#f7fafc;border-radius:7px;padding:8px 12px;font-size:.88rem;color:#2d3748;line-height:1.5;margin-bottom:8px;border-right:3px solid #e2e8f0}
.ib{background:#fff5f5;border:1px solid #fed7d7;border-radius:7px;padding:7px 12px;color:#c53030;font-size:.85rem;margin-bottom:8px}
.sb2{background:#f0fff4;border:1px solid #c6f6d5;border-radius:7px;padding:8px 12px}
.si{font-size:.84rem;color:#276749;padding:4px 0;border-bottom:1px dashed #c6f6d5;line-height:1.4}
.si:last-child{border-bottom:none}.si::before{content:"💡 "}
.good{text-align:center;padding:36px;color:#38a169;font-size:1.2rem;font-weight:600;background:white;border-radius:14px}
.exp{padding:8px 18px;border-radius:8px;border:1.5px solid #3182ce;background:white;color:#3182ce;cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit}
</style>
</head>
<body>
<div class="box">
  <h1>🎓 בודק התאמת הערות לציונים</h1>
  <p class="sub">בית ספר אורט פסגות · בדיקה אוטומטית של תעודות מחצית</p>
  <div class="card">
    <div class="drop" id="drop" onclick="document.getElementById('fi').click()">
      <div class="icon">📄</div>
      <h3>גרירי קובץ תעודות לכאן, או לחצי לבחירה</h3>
      <p>קובץ Word (.docx) של כיתה שלמה</p>
    </div>
    <input type="file" id="fi" accept=".docx" multiple>
    <div id="msg" class="msg"></div>
  </div>
  <button class="btn" id="btn" disabled onclick="run()">🔍 בדוק התאמת הערות לציונים</button>
  <div class="prog" id="prog">
    <div class="pgb"><div class="pgi" id="pb"></div></div>
    <div class="pgl" id="pl"></div>
  </div>
  <div class="err" id="er"></div>
  <div id="res"></div>
</div>
<script>
var rows = [];

var drop = document.getElementById('drop');
drop.addEventListener('dragover', function(e) { e.preventDefault(); drop.style.background = '#ebf8ff'; });
drop.addEventListener('dragleave', function() { drop.style.background = ''; });
drop.addEventListener('drop', function(e) { e.preventDefault(); drop.style.background = ''; go(e.dataTransfer.files); });
document.getElementById('fi').addEventListener('change', function(e) { go(e.target.files); });

async function go(files) {
  rows = [];
  setErr('');
  document.getElementById('res').innerHTML = '';
  var names = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (!f.name.endsWith('.docx')) continue;
    names.push(f.name);
    try {
      var ab = await f.arrayBuffer();
      var r = await mammoth.convertToHtml({ arrayBuffer: ab });
      var parsed = parse(r.value, f.name);
      rows = rows.concat(parsed);
    } catch(e) { setErr('שגיאה: ' + e.message); return; }
  }
  var msg = document.getElementById('msg');
  msg.style.display = 'block';
  if (rows.length > 0) {
    msg.className = 'msg ok';
    var names2 = rows.map(function(r) { return r.studentName; }).filter(Boolean);
    var st = new Set(names2).size;
    msg.textContent = 'נטען: ' + rows.length + ' מקצועות, ' + (st || '?') + ' תלמידים';
    document.getElementById('btn').disabled = false;
  } else {
    msg.className = 'msg bad';
    msg.textContent = 'לא נמצאו ציונים בקובץ';
  }
}

function parse(html, fn) {
  var d = document.createElement('div');
  d.innerHTML = html;
  var out = [];
  var tables = d.querySelectorAll('table');
  for (var t = 0; t < tables.length; t++) {
    var tbl = tables[t];
    var tr = tbl.querySelectorAll('tr');
    if (tr.length < 2) continue;
    var hdr = tr[0].textContent;
    if (hdr.indexOf('מקצוע') < 0 && hdr.indexOf('ציון') < 0 && hdr.indexOf('הערכה') < 0) continue;
    var sn = '';
    var prev = tbl.previousElementSibling;
    for (var k = 0; k < 10 && prev; k++) {
      var tx = prev.textContent || '';
      if (tx.indexOf('שם התלמיד') >= 0) {
        sn = tx.replace(/שם התלמידה?\s*[:：]?\s*/, '').replace(/\s*מס[׳']\s*זהות[\s\S]*/, '').replace(/\s*כיתה[\s\S]*/, '').trim();
        break;
      }
      prev = prev.previousElementSibling;
    }
    for (var i = 1; i < tr.length; i++) {
      var cells = tr[i].querySelectorAll('td,th');
      if (cells.length < 4) continue;
      var c0 = cells[0].textContent.trim().replace(/\s+/g, ' ');
      var c1 = cells[1].textContent.trim().replace(/\s+/g, ' ');
      var c2 = cells[2].textContent.trim().replace(/\s+/g, ' ');
      var c3 = cells[3].textContent.trim();
      var grade = parseInt(c3);
      if (isNaN(grade) || grade < 1 || grade > 100) continue;
      if (!c0 || c0.length < 1 || !c2 || c2.length < 3) continue;
      if (c0.indexOf('מקצוע') >= 0) continue;
      out.push({ subject: c0.replace(/\s+/g, ''), teacher: c1, comment: c2, grade: grade, studentName: sn, fileName: fn });
    }
  }
  return out;
}

async function run() {
  document.getElementById('btn').disabled = true;
  document.getElementById('res').innerHTML = '';
  setErr('');
  var B = 15, bats = [];
  for (var i = 0; i < rows.length; i += B) bats.push(rows.slice(i, i + B));
  var prog = document.getElementById('prog');
  prog.style.display = 'block';
  var all = [];
  for (var b = 0; b < bats.length; b++) {
    document.getElementById('pl').textContent = 'בודק ' + (b + 1) + ' מתוך ' + bats.length + '...';
    document.getElementById('pb').style.width = Math.round(b / bats.length * 100) + '%';
    try {
      var resp = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rows: bats[b] }) });
      var data = await resp.json();
      if (data.error) throw new Error(data.error);
      for (var i = 0; i < data.results.length; i++) {
        var rr = data.results[i];
        var o = bats[b][i];
        all.push({ isMatch: rr.isMatch, severity: rr.severity, issue: rr.issue, suggestions: rr.suggestions, subject: o.subject, grade: o.grade, comment: o.comment, teacher: o.teacher, studentName: o.studentName });
      }
    } catch(e) { prog.style.display = 'none'; setErr('שגיאה: ' + e.message); document.getElementById('btn').disabled = false; return; }
  }
  document.getElementById('pb').style.width = '100%';
  document.getElementById('pl').textContent = 'סיום! נבדקו ' + all.length + ' מקצועות.';
  setTimeout(function() { prog.style.display = 'none'; }, 1500);
  render(all);
  document.getElementById('btn').disabled = false;
}

function gc(g) { return g >= 90 ? 'ga' : g >= 80 ? 'gb' : g >= 70 ? 'gc' : g >= 55 ? 'gd' : 'gf'; }
function setErr(m) { var e = document.getElementById('er'); e.style.display = m ? 'block' : 'none'; e.textContent = m; }

function render(all) {
  var iss = all.filter(function(r) { return !r.isMatch; });
  var ok = all.filter(function(r) { return r.isMatch; });
  var h = '<div class="grid"><div class="st sb"><div class="sn">' + all.length + '</div><div class="sl">מקצועות</div></div><div class="st sg"><div class="sn">' + ok.length + '</div><div class="sl">תקין</div></div><div class="st sr"><div class="sn">' + iss.length + '</div><div class="sl">לא תואם</div></div></div>';
  h += '<div style="text-align:left;margin-bottom:12px"><button class="exp" onclick="doCSV()">⬇️ ייצא CSV</button></div>';
  h += '<div class="tabs"><button class="tab on" onclick="filt(\'a\',this)">הכל (' + all.length + ')</button><button class="tab" onclick="filt(\'i\',this)">⚠️ בעיות (' + iss.length + ')</button><button class="tab" onclick="filt(\'o\',this)">✅ תקין (' + ok.length + ')</button></div>';
  if (!iss.length) h += '<div class="good">✅ כל ההערות תואמות!</div>';
  for (var i = 0; i < all.length; i++) {
    var r = all[i];
    var cl = r.isMatch ? 'cok' : (r.severity === 'error' ? 'cer' : 'cwn');
    var fc = r.isMatch ? 'ro' : 'ri';
    var sugg = '';
    if (!r.isMatch && r.suggestions && r.suggestions.length) {
      sugg = '<div class="sb2"><div class="lb" style="color:#38a169">הצעות חלופיות</div>';
      for (var j = 0; j < r.suggestions.length; j++) sugg += '<div class="si">' + r.suggestions[j] + '</div>';
      sugg += '</div>';
    }
    h += '<div class="rc ' + cl + ' ' + fc + '">' +
      '<div class="rh"><div><div class="rn">' + (r.subject || '—') + '</div><div class="rm">' + (r.studentName ? '👤 ' + r.studentName : '') + (r.teacher ? ' · 👨‍🏫 ' + r.teacher : '') + '</div></div>' +
      '<span class="gp ' + gc(r.grade) + '">ציון ' + r.grade + '</span></div>' +
      '<div class="lb">הערה</div><div class="cm">' + r.comment + '</div>' +
      (!r.isMatch ? '<div class="ib">⚠️ ' + r.issue + '</div>' + sugg : '') +
      '</div>';
  }
  document.getElementById('res').innerHTML = h;
  window._r = all;
}

function filt(f, btn) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
  btn.classList.add('on');
  var cards = document.querySelectorAll('.rc');
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    if (f === 'a') c.classList.remove('hid');
    else if (f === 'i') c.classList.toggle('hid', c.classList.contains('ro'));
    else c.classList.toggle('hid', c.classList.contains('ri'));
  }
}

function doCSV() {
  if (!window._r) return;
  var BOM = '\uFEFF';
  var hdr = 'תלמיד,מקצוע,מורה,ציון,הערה,תקין?,בעיה,הצעות';
  var lines = window._r.map(function(r) {
    return [r.studentName||'', r.subject||'', r.teacher||'', r.grade,
      '"' + r.comment.replace(/"/g, '""') + '"',
      r.isMatch ? 'כן' : 'לא',
      '"' + (r.issue||'').replace(/"/g, '""') + '"',
      '"' + (r.suggestions||[]).join(' | ').replace(/"/g, '""') + '"'
    ].join(',');
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([BOM + hdr + '\n' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'דוח_תעודות.csv';
  a.click();
}
</script>
</body>
</html>
